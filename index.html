
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="css/llery.css">
    <script src="js/gallery.js" defer></script>
</head>
<body>

    <h1>Interactive Photo Gallery</h1>

    <div id="image">
        Hover over or focus on an image below to display it here.
    </div>

    <img class="preview"
         alt="Styling with a Bandana"
         src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon.jpg"
         onmouseover="upDate(this)"
         onmouseleave="unDo()"
         onfocus="upDate(this)"
         onblur="unDo()">

    <img class="preview"
         alt="With My Boy"
         src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon2.JPG"
         onmouseover="upDate(this)"
         onmouseleave="unDo()"
         onfocus="upDate(this)"
         onblur="unDo()">

    <img class="preview"
         alt="Young Puppy"
         src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon3.jpg"
         onmouseover="upDate(this)"
         onmouseleave="unDo()"
         onfocus="upDate(this)"
         onblur="unDo()">

    <img class="preview"
         alt="A beautiful mountain landscape"
         src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80"
         onmouseover="upDate(this)"
         onmouseleave="unDo()"
         onfocus="upDate(this)"
         onblur="unDo()">

    <img class="preview"
         alt="A peaceful beach with blue ocean water"
         src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
         onmouseover="upDate(this)"
         onmouseleave="unDo()"
         onfocus="upDate(this)"
         onblur="unDo()">

    <img class="preview"
         alt="Sunlight shining through a green forest"
         src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
         onmouseover="upDate(this)"
         onmouseleave="unDo()"
         onfocus="upDate(this)"
         onblur="unDo()">

</body>
</html>
